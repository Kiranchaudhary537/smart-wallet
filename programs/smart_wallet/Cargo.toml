[package]
name = "smart_wallet"
version = "0.1.0"
description = "PDA smart wallet with owner + scoped, rate-limited delegates"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "smart_wallet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.2"
anchor-spl = "=1.2.2"
